<svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frame" x1="140" y1="90" x2="380" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="185" y1="155" x2="350" y2="395" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 250) rotate(90) scale(180)">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="0" y="0" width="520" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#ds)">
    <!-- body -->
    <rect x="150" y="75" width="220" height="370" rx="44" fill="url(#frame)"/>
    <rect x="160" y="85" width="200" height="350" rx="38" fill="#0A0F1C"/>

    <!-- camera island -->
    <rect x="170" y="98" width="92" height="92" rx="22" fill="#111827" stroke="#1F2937" stroke-width="2"/>
    <circle cx="196" cy="124" r="13" fill="#0B1220" stroke="#334155" stroke-width="3"/>
    <circle cx="236" cy="124" r="13" fill="#0B1220" stroke="#334155" stroke-width="3"/>
    <circle cx="196" cy="164" r="13" fill="#0B1220" stroke="#334155" stroke-width="3"/>
    <circle cx="236" cy="164" r="8" fill="#0B1220" stroke="#334155" stroke-width="3"/>
    <circle cx="254" cy="144" r="5" fill="#0B1220" stroke="#334155" stroke-width="2"/>

    <!-- screen -->
    <rect x="170" y="145" width="180" height="275" rx="30" fill="url(#screen)"/>
    <rect x="170" y="145" width="180" height="275" rx="30" fill="url(#glow)"/>

    <!-- dynamic island -->
    <rect x="220" y="158" width="80" height="18" rx="9" fill="#050B16" opacity="0.85"/>

    <!-- subtle UI -->
    <circle cx="205" cy="210" r="16" fill="#ffffff" fill-opacity="0.22"/>
    <circle cx="245" cy="210" r="16" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="285" cy="210" r="16" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="190" y="252" width="140" height="16" rx="8" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="190" y="278" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="190" y="316" width="140" height="58" rx="16" fill="#050B16" fill-opacity="0.25"/>

    <!-- buttons -->
    <rect x="145" y="160" width="6" height="42" rx="3" fill="#0B1220"/>
    <rect x="145" y="220" width="6" height="28" rx="3" fill="#0B1220"/>
    <rect x="369" y="190" width="6" height="52" rx="3" fill="#0B1220"/>
  </g>
</svg>
