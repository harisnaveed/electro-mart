<svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="140" y1="90" x2="410" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="g2" x1="185" y1="180" x2="340" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="520" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- strap -->
  <g filter="url(#shadow)">
    <path d="M210 40c0-14 12-26 26-26h48c14 0 26 12 26 26v90c0 14-12 26-26 26h-48c-14 0-26-12-26-26V40z" fill="#0F172A"/>
    <path d="M210 390c0-14 12-26 26-26h48c14 0 26 12 26 26v90c0 14-12 26-26 26h-48c-14 0-26-12-26-26v-90z" fill="#0F172A"/>

    <!-- watch body -->
    <rect x="140" y="140" width="240" height="240" rx="58" fill="url(#g1)"/>
    <rect x="162" y="162" width="196" height="196" rx="48" fill="#0B1220"/>

    <!-- screen -->
    <circle cx="260" cy="260" r="78" fill="#050B16"/>
    <circle cx="260" cy="260" r="66" fill="none" stroke="url(#g2)" stroke-width="14" stroke-linecap="round"/>
    <path d="M260 198a62 62 0 0 1 52 28" stroke="#F97316" stroke-width="12" stroke-linecap="round"/>
    <path d="M208 296a62 62 0 0 0 84 18" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/>

    <!-- time -->
    <text x="260" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="36" font-weight="700" fill="#FFFFFF">12:00</text>
    <text x="260" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" font-weight="600" fill="#94A3B8">Fitness</text>

    <!-- crown -->
    <rect x="380" y="232" width="22" height="56" rx="11" fill="#111827"/>
    <rect x="402" y="244" width="10" height="32" rx="5" fill="#0B1220"/>
  </g>
